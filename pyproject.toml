[project]
name = "chess-forces"
version = "0.0.1"
description = "Forces on a fixed field: structural descriptions of chess endgames, scored by size at a fixed compute budget"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "zstandard>=0.23",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "chess>=1.11"]

[project.scripts]
chess-forces = "chess_forces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_forces"]

[tool.ruff]
line-length = 100
